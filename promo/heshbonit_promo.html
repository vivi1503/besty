<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Heshbonit Promo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #0b0716;
    --bg-2: #1a1036;
    --purple: #7b2ff7;
    --pink: #e83cf0;
    --blue: #3a6ff0;
    --grad: linear-gradient(90deg, var(--purple), var(--pink));
    --grad-text: linear-gradient(90deg, var(--blue), var(--purple) 45%, var(--pink));
    --paper: #ffffff;
    --ink: #0d0b1a;
    --muted: #6d6a85;
    --soft: #c9c2e6;
    --green: #16a34a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  body { font-family: 'Heebo', sans-serif; color: #fff; position: relative; }
  .abs { position: absolute; }
  .gt { background: var(--grad-text); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .emoji { font-family: 'Noto Color Emoji'; }
  #stage { position: absolute; inset: 0; overflow: hidden; }

  /* background */
  #bg { position: absolute; inset: 0; background: radial-gradient(120% 80% at 50% 0%, var(--bg-2), var(--bg)); }
  .blob { position: absolute; border-radius: 50%; filter: blur(100px); opacity: .5; }
  #blob1 { width: 700px; height: 700px; background: var(--purple); }
  #blob2 { width: 800px; height: 800px; background: var(--pink); opacity: .35; }
  #wipe { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--grad);
          left: 540px; top: 960px; transform: translate(-50%, -50%) scale(0); }

  /* logo mark (recreation of the site icon) */
  .logo { border-radius: 26%; background: #0d0b1a; display: flex; align-items: center; justify-content: center;
          box-shadow: 0 30px 70px rgba(0,0,0,.35), inset 0 0 0 3px rgba(255,255,255,.08); }

  /* scene 1: paper chaos */
  .sheet { position: absolute; left: 0; top: 0; width: 260px; height: 340px; background: #f4f3fb; border-radius: 14px;
           box-shadow: 0 20px 50px rgba(0,0,0,.4); padding: 36px 30px; }
  .sheet i { display: block; height: 14px; border-radius: 7px; background: #d4cfe6; margin-bottom: 20px; }
  .sheet i:nth-child(2) { width: 70%; } .sheet i:nth-child(4) { width: 55%; } .sheet i:nth-child(5) { width: 80%; }
  #q1 { width: 960px; left: 60px; top: 1360px; text-align: center; font-size: 100px; font-weight: 900; line-height: 1.15; }
  #q1 span { display: inline-block; margin: 0 10px; }

  /* scene 2: logo */
  #logoWrap { width: 1080px; left: 0; top: 560px; text-align: center; }
  #logoWrap .logo { width: 280px; height: 280px; margin: 0 auto; }
  #headline { font-size: 132px; font-weight: 900; margin-top: 70px; line-height: 1.08; letter-spacing: -1px; }
  #headline span { display: block; }
  #siteName { display: inline-block; margin-top: 50px; font-size: 54px; font-weight: 700; direction: ltr;
              padding: 16px 50px; border-radius: 60px; background: rgba(13,11,26,.25); }

  /* scene 3: invoice */
  #s3title { width: 1080px; left: 0; top: 210px; text-align: center; font-size: 80px; font-weight: 900; line-height: 1.15; }
  #invoice { width: 820px; left: 130px; top: 560px; background: var(--paper); border-radius: 36px; color: var(--ink);
             padding: 60px 60px 50px; box-shadow: 0 40px 90px rgba(0,0,0,.45); }
  #invHead { display: flex; justify-content: space-between; align-items: center; padding-bottom: 30px; border-bottom: 3px solid #efedf7; }
  #invHead .t { font-size: 52px; font-weight: 800; }
  #invHead .n { font-size: 36px; color: var(--muted); font-weight: 500; direction: ltr; }
  #invTo { font-size: 34px; color: var(--muted); margin: 26px 0 16px; }
  .row { display: flex; justify-content: space-between; font-size: 42px; padding: 22px 0; border-bottom: 2px dashed #e6e3f0; }
  .row .p { font-weight: 700; direction: ltr; }
  #total { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; font-size: 50px; font-weight: 900; }
  #totalNum { direction: ltr; font-size: 64px; }
  #sendBtn { margin-top: 44px; height: 120px; border-radius: 60px; background: var(--grad); color: #fff;
             display: flex; align-items: center; justify-content: center; gap: 20px; font-size: 50px; font-weight: 900;
             box-shadow: 0 16px 40px rgba(123,47,247,.35); }
  #cursor { left: 0; top: 0; width: 70px; height: 70px; border-radius: 50%; background: rgba(255,255,255,.92); border: 6px solid var(--ink);
            box-shadow: 0 10px 30px rgba(0,0,0,.3); }
  #sent { width: 1080px; left: 0; top: 800px; text-align: center; }
  #sentCircle { width: 300px; height: 300px; border-radius: 50%; background: var(--grad); margin: 0 auto;
                display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 30px rgba(232,60,240,.15); }
  #sentText { font-size: 80px; font-weight: 900; margin-top: 60px; }

  /* scene 4: features */
  #s4title { width: 1080px; left: 0; top: 280px; text-align: center; font-size: 104px; font-weight: 900; }
  #s4sub { width: 1080px; left: 0; top: 420px; text-align: center; font-size: 44px; color: var(--soft); }
  .feat { width: 900px; left: 90px; height: 200px; background: rgba(255,255,255,.07); border: 2px solid rgba(255,255,255,.14);
          border-radius: 40px; display: flex; align-items: center; gap: 44px; padding: 0 44px; }
  .feat .ic { width: 124px; height: 124px; flex: none; border-radius: 32px; background: var(--grad);
              display: flex; align-items: center; justify-content: center; }
  .feat h3 { font-size: 56px; font-weight: 800; }
  .feat p { font-size: 36px; color: var(--soft); margin-top: 2px; }

  /* scene 5: price */
  #price { width: 1080px; left: 0; top: 380px; text-align: center; }
  #badge { display: inline-block; padding: 22px 56px; border-radius: 60px; background: var(--grad); font-size: 46px; font-weight: 800;
           box-shadow: 0 16px 50px rgba(232,60,240,.35); }
  #priceLine { margin-top: 70px; display: flex; justify-content: center; align-items: baseline; gap: 30px; }
  #priceNum { font-size: 330px; font-weight: 900; line-height: 1; direction: ltr; letter-spacing: -6px; }
  #perMonth { font-size: 70px; font-weight: 800; }
  #priceSub { font-size: 50px; color: var(--soft); margin-top: 30px; }
  .chip { display: flex; align-items: center; justify-content: center; gap: 24px; width: 820px; margin: 0 auto; height: 150px;
          border-radius: 75px; background: #fff; color: var(--ink); font-size: 56px; font-weight: 900; }
  #chips { margin-top: 90px; display: flex; flex-direction: column; gap: 36px; }

  /* scene 6: CTA */
  #cta { width: 1080px; left: 0; top: 500px; text-align: center; }
  #cta .logo { width: 210px; height: 210px; margin: 0 auto; }
  #ctaHead { font-size: 124px; font-weight: 900; margin-top: 70px; line-height: 1.08; }
  #ctaBtn { display: inline-flex; align-items: center; gap: 26px; margin-top: 80px; padding: 42px 90px; border-radius: 100px;
            background: var(--grad); font-size: 66px; font-weight: 900; box-shadow: 0 20px 60px rgba(123,47,247,.45); }
  #urlWrap { position: relative; display: inline-block; margin-top: 60px; }
  #url { font-size: 74px; font-weight: 800; direction: ltr; letter-spacing: 1px; }
  #ctaFoot { font-size: 40px; color: var(--soft); margin-top: 30px; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div class="blob" id="blob1"></div>
  <div class="blob" id="blob2"></div>

  <!-- Scene 1 -->
  <div id="s1">
    <div class="sheet" id="sh0"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="sheet" id="sh1"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="sheet" id="sh2"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="sheet" id="sh3"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="sheet" id="sh4"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="abs" id="q1"></div>
  </div>

  <div id="wipe"></div>

  <!-- Scene 2 -->
  <div class="abs" id="logoWrap">
    <div class="logo" id="logo1"></div>
    <div id="headline"></div>
    <div id="siteName"></div>
  </div>

  <!-- Scene 3 -->
  <div class="abs" id="s3title"></div>
  <div class="abs" id="invoice">
    <div id="invHead"><div class="t" id="invT"></div><div class="n" id="invN"></div></div>
    <div id="invTo"></div>
    <div id="rows"></div>
    <div id="total"><span id="totalLbl"></span><span id="totalNum" class="gt"></span></div>
    <div id="sendBtn"><span id="sendLbl"></span><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg></div>
  </div>
  <div class="abs" id="cursor"></div>
  <div class="abs" id="sent">
    <div id="sentCircle"><svg width="170" height="170" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path id="checkPath" d="M5 12.5l4.5 4.5L19 7.5" stroke-dasharray="22" stroke-dashoffset="22"/></svg></div>
    <div id="sentText"></div>
  </div>

  <!-- Scene 4 -->
  <div class="abs" id="s4title"></div>
  <div class="abs" id="s4sub"></div>
  <div id="feats"></div>

  <!-- Scene 5 -->
  <div class="abs" id="price">
    <div id="badge"></div>
    <div id="priceLine"><span id="priceNum" class="gt"></span><span id="perMonth"></span></div>
    <div id="priceSub"></div>
    <div id="chips"></div>
  </div>

  <!-- Scene 6 -->
  <div class="abs" id="cta">
    <div class="logo" id="logo2"></div>
    <div id="ctaHead"></div>
    <div id="ctaBtn"></div><br>
    <div id="urlWrap"><div id="url" class="gt"></div></div>
    <div id="ctaFoot"></div>
  </div>
</div>

<script>
/* ============================================================
   EDIT YOUR TEXT HERE — everything the viewer reads lives in CONFIG.
   ============================================================ */
const CONFIG = {
  question: ['עדיין', 'רודפים', 'אחרי', 'ניירת?'],
  headline: ['כל העסק שלך.', 'במקום אחד.'],
  site: 'heshbonit.org',
  s3title: 'הצעת מחיר, חשבונית וקבלה<br><span class="gt">בכמה קליקים</span>',
  invoiceTitle: 'חשבונית',
  invoiceNumber: '#1024',
  invoiceTo: 'לכבוד: סטודיו אור בע״מ',
  items: [
    ['עיצוב לוגו', 1200],
    ['בניית אתר', 4500],
    ['שעת ייעוץ', 800],
  ],
  totalLabel: 'סה״כ לתשלום',
  sendLabel: 'שליחה ללקוח',
  sentText: 'נשלחה ללקוח!',
  s4title: 'הכל כלול.',
  s4sub: 'מערכת אחת שמנהלת לך את העסק',
  features: [
    ['receipt', 'חשבוניות וקבלות', 'הצעות מחיר עם חתימה דיגיטלית'],
    ['truck', 'ניהול צי רכבים', 'כל הרכבים של העסק במקום אחד'],
    ['users', 'ניהול ספקים', 'ספקים, הוצאות ותשלומים — מסודר'],
    ['chart', 'מעקב דוחות לרו״ח', 'דוחות מוכנים לרואה החשבון'],
  ],
  badge: 'החודש הראשון — חינם לגמרי',
  price: 30,
  perMonth: 'לחודש',
  priceSub: 'הכל כלול. מבטלים בלחיצה, מתי שרוצים.',
  chips: [
    ['check', 'בלי אותיות קטנות'],
    ['check', 'ללא עליית מחירים <span class="emoji">🚀</span>'],
  ],
  ctaHead: 'כל העסק שלך.<br><span class="gt">במקום אחד.</span>',
  ctaBtn: 'מתחילים חודש חינם',
  ctaFoot: 'בלי כרטיס אשראי בהרשמה',
};
const DURATION = 25; // seconds

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, start, dur) => clamp((t - start) / dur);
const lerp = (a, b, p) => a + (b - a) * p;
const eOut = p => 1 - Math.pow(1 - p, 3);
const eIn = p => p * p * p;
const eInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eBack = p => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const shekel = n => '₪' + Math.round(n).toLocaleString('en-US');
const show = (el, o) => { el.style.opacity = o; el.style.visibility = o <= 0.001 ? 'hidden' : 'visible'; };
const svg = (paths, size, stroke = '#fff', w = 2.2) =>
  `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`;

const ICONS = {
  receipt: '<path d="M6 2h9l5 5v15l-2.5-1.5L15 22l-2.5-1.5L10 22l-2.5-1.5L5 22V3a1 1 0 0 1 1-1z"/><path d="M14 2v6h6"/><path d="M9 12h6M9 16h4"/>',
  truck: '<path d="M2 6h11v10H2z"/><path d="M13 9h4l4 4v3h-8z"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/>',
  chart: '<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-6"/><path d="M16 8h4v4"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
};

// Stylised "H" mark modelled on the site icon: gradient left stem + slash, white right stem.
const LOGO = s => `<svg width="${s}" height="${s}" viewBox="0 0 100 100">
  <defs><linearGradient id="lg${s}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7b2ff7"/><stop offset="1" stop-color="#e83cf0"/></linearGradient></defs>
  <path d="M22 14h16l-6 72H16z" fill="url(#lg${s})"/>
  <path d="M62 14h18l-4 72H60z" fill="#f4efe6"/>
  <path d="M28 58 70 30v14L26 72z" fill="url(#lg${s})"/>
</svg>`;

/* ---------- build DOM from CONFIG ---------- */
$('q1').innerHTML = CONFIG.question.map(w => `<span>${w}</span>`).join(' ');
$('logo1').innerHTML = LOGO(190);
$('logo2').innerHTML = LOGO(140);
$('headline').innerHTML = CONFIG.headline.map(l => `<span>${l}</span>`).join('');
$('siteName').textContent = CONFIG.site;
$('s3title').innerHTML = CONFIG.s3title;
$('invT').textContent = CONFIG.invoiceTitle;
$('invN').textContent = CONFIG.invoiceNumber;
$('invTo').textContent = CONFIG.invoiceTo;
$('rows').innerHTML = CONFIG.items.map(([n, p]) =>
  `<div class="row"><span>${n}</span><span class="p">${shekel(p)}</span></div>`).join('');
$('totalLbl').textContent = CONFIG.totalLabel;
$('sendLbl').textContent = CONFIG.sendLabel;
$('sentText').textContent = CONFIG.sentText;
$('s4title').textContent = CONFIG.s4title;
$('s4sub').textContent = CONFIG.s4sub;
$('feats').innerHTML = CONFIG.features.map(([ic, h, p], i) =>
  `<div class="abs feat" style="top:${560 + i * 240}px"><div class="ic">${svg(ICONS[ic], 72)}</div><div><h3>${h}</h3><p>${p}</p></div></div>`).join('');
$('badge').textContent = CONFIG.badge;
$('perMonth').textContent = CONFIG.perMonth;
$('priceSub').textContent = CONFIG.priceSub;
$('chips').innerHTML = CONFIG.chips.map(([ic, txt]) =>
  `<div class="chip">${svg(ICONS[ic], 60, 'var(--green)', 3.2)}<span>${txt}</span></div>`).join('');
$('ctaHead').innerHTML = CONFIG.ctaHead;
$('ctaBtn').innerHTML = `<span>${CONFIG.ctaBtn}</span>${svg('<path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/>', 64, '#fff', 2.8)}`;
$('url').textContent = CONFIG.site;
$('ctaFoot').textContent = CONFIG.ctaFoot;

const TOTAL = CONFIG.items.reduce((s, [, p]) => s + p, 0);
const SHEETS = [
  { x: 120, y: 260, r: -18, d: 0.00 }, { x: 700, y: 180, r: 14, d: 0.15 }, { x: 410, y: 520, r: -6, d: 0.30 },
  { x: 80, y: 820, r: 22, d: 0.45 }, { x: 740, y: 760, r: -24, d: 0.60 },
];

/* ---------- timeline: pure function of t ---------- */
function seek(t) {
  // background blobs drift continuously
  $('blob1').style.transform = `translate(${-200 + Math.sin(t * .5) * 120}px, ${-150 + Math.cos(t * .4) * 140}px)`;
  $('blob2').style.transform = `translate(${480 + Math.cos(t * .35) * 140}px, ${1300 + Math.sin(t * .45) * 160}px)`;

  /* Scene 1 (0 – 3.4s): paper chaos + question */
  const s1out = eIn(prog(t, 2.9, .5));
  SHEETS.forEach((s, i) => {
    const el = $('sh' + i);
    const pin = eOut(prog(t, s.d, .7));
    const wob = Math.sin(t * 2 + i) * 4;
    const y = lerp(-500, s.y, pin) + s1out * (900 + i * 120);
    el.style.transform = `translate(${s.x}px, ${y}px) rotate(${s.r * pin + wob + s1out * s.r * 3}deg)`;
    show(el, pin * (1 - s1out));
  });
  [...$('q1').children].forEach((w, i) => {
    const p = eBack(prog(t, .6 + i * .25, .45));
    w.style.transform = `translateY(${(1 - p) * 80}px) scale(${.6 + .4 * p})`;
    w.style.opacity = clamp(p) * (1 - s1out);
  });
  show($('s1'), t < 3.5 ? 1 : 0);

  /* Gradient circle wipe in (3.2 – 3.9) and out (6.4 – 7.0) */
  const wIn = eInOut(prog(t, 3.2, .7)), wOut = eInOut(prog(t, 6.4, .6));
  $('wipe').style.transform = `translate(-50%, -50%) scale(${wIn * 450})`;
  show($('wipe'), wIn > 0 && wOut < 1 ? 1 - wOut : 0);

  /* Scene 2 (3.6 – 6.8): logo + headline */
  const ic = eBack(prog(t, 3.7, .6));
  $('logo1').style.transform = `scale(${ic}) rotate(${(1 - ic) * -30}deg)`;
  [...$('headline').children].forEach((l, i) => {
    const p = eOut(prog(t, 4.1 + i * .3, .6));
    l.style.opacity = p; l.style.transform = `translateY(${(1 - p) * 60}px)`;
  });
  const sn = eBack(prog(t, 4.9, .5));
  $('siteName').style.transform = `scale(${sn})`;
  const s2out = eIn(prog(t, 6.3, .45));
  $('logoWrap').style.transform = `scale(${1 - s2out * .2})`;
  show($('logoWrap'), t >= 3.6 ? 1 - s2out : 0);

  /* Scene 3 (6.9 – 13.2): invoice builds, gets sent */
  const s3in = eOut(prog(t, 6.9, .7));
  const fly = eIn(prog(t, 11.0, .5));
  $('s3title').style.transform = `translateY(${(1 - s3in) * -60}px)`;
  show($('s3title'), s3in * (1 - prog(t, 10.9, .4)));
  $('invoice').style.transform = `translateY(${(1 - s3in) * 300 - fly * 1600}px) rotate(${fly * -12}deg) scale(${1 - fly * .3})`;
  show($('invoice'), t < 11.6 ? s3in : 0);
  [...$('rows').children].forEach((r, i) => {
    const p = eOut(prog(t, 7.6 + i * .45, .45));
    r.style.opacity = p; r.style.transform = `translateX(${(1 - p) * -80}px)`;
  });
  $('totalNum').textContent = shekel(TOTAL * eOut(prog(t, 8.9, 1.1)));
  $('total').style.opacity = prog(t, 8.8, .3);
  const btnIn = eBack(prog(t, 9.4, .45));
  const press = Math.sin(Math.PI * prog(t, 10.55, .3));
  $('sendBtn').style.transform = `scale(${btnIn * (1 - press * .07)})`;
  // cursor travels to the button and clicks
  const cm = eInOut(prog(t, 9.8, .75));
  $('cursor').style.transform = `translate(${lerp(900, 505, cm)}px, ${lerp(1750, 1250, cm)}px) scale(${1 - press * .25})`;
  show($('cursor'), prog(t, 9.8, .2) * (1 - prog(t, 10.9, .2)));
  // "sent" confirmation
  $('sentCircle').style.transform = `scale(${eBack(prog(t, 11.4, .5))})`;
  $('checkPath').setAttribute('stroke-dashoffset', 22 * (1 - eOut(prog(t, 11.7, .45))));
  const st = eOut(prog(t, 11.9, .5));
  $('sentText').style.opacity = st; $('sentText').style.transform = `translateY(${(1 - st) * 50}px)`;
  show($('sent'), t >= 11.3 ? 1 - eIn(prog(t, 12.9, .4)) : 0);

  /* Scene 4 (13.3 – 17.6): everything included */
  const s4t = eOut(prog(t, 13.3, .5)), s4out = eIn(prog(t, 17.2, .45));
  $('s4title').style.transform = `scale(${.8 + .2 * s4t})`;
  show($('s4title'), s4t * (1 - s4out));
  const s4s = eOut(prog(t, 13.6, .5));
  $('s4sub').style.transform = `translateY(${(1 - s4s) * 30}px)`;
  show($('s4sub'), s4s * (1 - s4out));
  [...$('feats').children].forEach((b, i) => {
    const d = 13.9 + i * .4;
    const p = eBack(prog(t, d, .55)), icp = eBack(prog(t, d + .25, .5));
    b.style.transform = `translateX(${(1 - p) * 1100 - s4out * (1100 + i * 150)}px)`;
    b.querySelector('.ic').style.transform = `scale(${icp}) rotate(${(1 - icp) * 90}deg)`;
    show(b, prog(t, d, .15) * (1 - s4out));
  });

  /* Scene 5 (17.7 – 21.8): price */
  const b1 = eBack(prog(t, 17.7, .5));
  $('badge').style.transform = `scale(${b1})`;
  const pn = eBack(prog(t, 18.0, .6));
  $('priceNum').textContent = '₪' + Math.round(CONFIG.price * eOut(prog(t, 18.0, .9)));
  $('priceNum').style.transform = `scale(${.5 + .5 * pn})`;
  const pm = eOut(prog(t, 18.5, .4));
  $('perMonth').style.opacity = pm; $('perMonth').style.transform = `translateX(${(1 - pm) * 40}px)`;
  const ps = eOut(prog(t, 18.8, .5));
  $('priceSub').style.opacity = ps; $('priceSub').style.transform = `translateY(${(1 - ps) * 30}px)`;
  [...$('chips').children].forEach((c, i) => {
    const p = eBack(prog(t, 19.3 + i * .45, .5));
    c.style.transform = `scale(${p})`;
    c.style.opacity = prog(t, 19.3 + i * .45, .15);
  });
  const s5out = eIn(prog(t, 21.4, .4));
  $('price').style.transform = `translateY(${-s5out * 120}px)`;
  show($('price'), t >= 17.6 ? 1 - s5out : 0);

  /* Scene 6 (21.8 – 25): CTA */
  const c1 = eBack(prog(t, 21.85, .55)), c2 = eOut(prog(t, 22.1, .6)), c3 = eBack(prog(t, 22.5, .55)), c4 = eOut(prog(t, 22.9, .5));
  $('logo2').style.transform = `scale(${c1}) rotate(${(1 - c1) * 40}deg)`;
  $('ctaHead').style.opacity = c2; $('ctaHead').style.transform = `translateY(${(1 - c2) * 70}px)`;
  const pulse = t > 23.3 ? 1 + Math.sin((t - 23.3) * 5) * .035 : 1;
  $('ctaBtn').style.transform = `scale(${c3 * pulse})`;
  $('urlWrap').style.opacity = c4; $('urlWrap').style.transform = `translateY(${(1 - c4) * 30}px)`;
  $('ctaFoot').style.opacity = eOut(prog(t, 23.2, .5));
  show($('cta'), t >= 21.8 ? 1 : 0);
}

window.seek = seek;
window.DURATION = DURATION;
seek(0);

// Live preview when opened directly in a browser (the renderer sets ?render=1).
if (!location.search.includes('render=1')) {
  document.fonts.ready.then(() => {
    const start = performance.now();
    const loop = now => { seek(((now - start) / 1000) % DURATION); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
</script>
</body>
