name: DeepTicker CI

on:
  push:
    branches: [main]
    paths:
      - "deepticker-live/**"
      - ".github/workflows/deepticker-ci.yml"
  pull_request:
    paths:
      - "deepticker-live/**"
      - ".github/workflows/deepticker-ci.yml"

defaults:
  run:
    working-directory: deepticker-live

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: deepticker-live/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          SEC_USER_AGENT: "DeepTicker CI contact@example.com"
